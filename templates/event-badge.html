<!-- Block: event-badge · tall dark card 2×3 (~193×308) · a conference badge that swings from a lanyard under stage spotlights.
     Use it for a talk, an award, a hackathon, a community you belong to.
     data: TAG, YEAR, EVENT_1, EVENT_2 (title lines), NAME_1, NAME_2 (badge name lines), COMPANY, ROLE_LABEL (e.g. SPEAKER), ORG_LINE, FOOT_LABEL, ACCENT -->
<div class="ev" role="group" aria-label="{{EVENT_1|Event}} {{EVENT_2|name}} {{YEAR|2026}}. {{NAME_1|Your}} {{NAME_2|Name}}, {{ROLE_LABEL|SPEAKER}}." style="{{RAW_ACCENT_VARS}}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
{{> page-bg ev}}
.ev{container-type:inline-size;position:relative;display:block;width:100%;height:100%;aspect-ratio:5/8;overflow:hidden;isolation:isolate;border-radius:inherit;background:#0b0b0d;color:#f4f1ec;font-family:'Inter',system-ui,sans-serif}
{{> noise ev}}
.ev *{box-sizing:border-box;margin:0}
.ev-beam{position:absolute;left:50%;top:-8cqw;width:150cqw;height:150cqw;margin-left:-75cqw;z-index:-1;transform-origin:50% 0;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 78%);mask-image:linear-gradient(180deg,#000 10%,transparent 78%)}
.ev-b1{background:conic-gradient(from 160deg at 50% 0%,transparent 0deg,rgba(255,236,214,.2) 1deg,rgba(255,236,214,.2) 40deg,transparent 41deg);animation:ev-sw1 7s ease-in-out infinite alternate}
.ev-b2{background:conic-gradient(from 170deg at 50% 0%,transparent 0deg,rgba(var(--a-rgb),.22) 1deg,rgba(var(--a-rgb),.22) 26deg,transparent 27deg);animation:ev-sw2 9s ease-in-out infinite alternate}
.ev-top{position:absolute;left:7cqw;right:7cqw;top:6cqw;display:flex;justify-content:space-between;font:500 3.6cqw/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.04em;color:rgba(244,241,236,.6);z-index:2}
.ev-swing{position:absolute;left:50%;top:0;width:60cqw;height:90cqw;margin-left:-30cqw;transform-origin:50% 0;animation:ev-pen 5.5s ease-in-out infinite alternate}
.ev-lan{position:absolute;left:0;top:0;width:60cqw;height:31cqw;overflow:visible}
.ev-lan path{fill:none;stroke:var(--a);stroke-width:3.2;stroke-linecap:butt}
.ev-clip{position:absolute;left:25cqw;top:27cqw;width:10cqw;height:5.6cqw;border-radius:1.2cqw;background:linear-gradient(180deg,#d8d4cc,#8d897f);z-index:2}
.ev-badge{position:absolute;left:7cqw;top:31cqw;width:46cqw;height:57cqw;border-radius:3cqw;overflow:hidden;background:#f4f1ec;color:#0b0b0d;box-shadow:0 3cqw 7cqw rgba(0,0,0,.5);display:flex;flex-direction:column}
.ev-slot{align-self:center;width:12cqw;height:2cqw;margin-top:2.6cqw;border-radius:99px;background:#0b0b0d;opacity:.85;flex:none}
.ev-bd{flex:1;padding:4cqw 4.4cqw 0;display:flex;flex-direction:column;gap:2cqw}
.ev-ev{font:500 2.6cqw/1.2 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b6760}
.ev-nm{font:700 9.4cqw/.98 'Inter',system-ui,sans-serif;letter-spacing:-.04em}
.ev-co{font:400 3.2cqw/1.2 'Inter',system-ui,sans-serif;color:#4d4a44}
.ev-qr{margin-top:auto;margin-bottom:2.4cqw;height:7cqw;background-image:repeating-linear-gradient(90deg,#0b0b0d 0 .6cqw,transparent .6cqw 1.3cqw,#0b0b0d 1.3cqw 2.6cqw,transparent 2.6cqw 3.2cqw);opacity:.8}
.ev-role{flex:none;height:11cqw;display:flex;align-items:center;justify-content:center;background:var(--a);color:#fff;font:600 3.9cqw/1 'Inter',system-ui,sans-serif;letter-spacing:.22em;text-indent:.22em}
.ev-badge::before{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-160%) skewX(-18deg);animation:ev-sh 5.5s ease-in-out infinite;z-index:3}
.ev-txt{position:absolute;left:7cqw;right:7cqw;top:94cqw}
.ev-h{font:700 10.6cqw/1 'Inter',system-ui,sans-serif;letter-spacing:-.04em}
.ev-h span{display:block;animation:ev-up .9s cubic-bezier(.2,.8,.2,1) both}
.ev-h span:nth-child(2){animation-delay:.12s;background:linear-gradient(90deg,#f4f1ec 10%,var(--a-lt) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ev-org{margin-top:3.4cqw;font:400 3.9cqw/1.4 'Inter',system-ui,sans-serif;color:rgba(244,241,236,.62);animation:ev-up .9s cubic-bezier(.2,.8,.2,1) both .25s}
.ev-foot{position:absolute;left:7cqw;right:7cqw;bottom:6.5cqw;display:flex;align-items:center;justify-content:space-between;font:500 3.3cqw/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.04em;text-transform:uppercase;color:rgba(244,241,236,.6)}
.ev-live{display:inline-flex;align-items:center;gap:1.8cqw;color:var(--a-lt)}
.ev-live i{width:2cqw;height:2cqw;border-radius:50%;background:var(--a);animation:ev-pl 1.8s ease-out infinite}
.ev-eq{display:inline-flex;align-items:flex-end;gap:.7cqw;height:3.6cqw}
.ev-eq b{width:.8cqw;background:currentColor;border-radius:1px;height:30%;animation:ev-eq 1.1s ease-in-out infinite}
.ev-eq b:nth-child(2){animation-delay:.2s}.ev-eq b:nth-child(3){animation-delay:.45s}.ev-eq b:nth-child(4){animation-delay:.1s}
@keyframes ev-sw1{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes ev-sw2{from{transform:rotate(12deg)}to{transform:rotate(-12deg)}}
@keyframes ev-pen{from{transform:rotate(-4.5deg)}to{transform:rotate(4.5deg)}}
@keyframes ev-sh{0%,40%{transform:translateX(-160%) skewX(-18deg)}80%,100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes ev-up{from{opacity:0;transform:translateY(3cqw)}to{opacity:1;transform:none}}
@keyframes ev-pl{0%{box-shadow:0 0 0 0 rgba(var(--a-rgb),.7)}100%{box-shadow:0 0 0 2.6cqw rgba(var(--a-rgb),0)}}
@keyframes ev-eq{0%,100%{height:25%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.ev *,.ev::after{animation:none!important}}
</style>
<i class="ev-beam ev-b1" aria-hidden="true"></i><i class="ev-beam ev-b2" aria-hidden="true"></i>
<div class="ev-top"><span>[ {{TAG|event}} ]</span><span>{{YEAR|2026}}</span></div>
<div class="ev-swing" aria-hidden="true">
  <svg class="ev-lan" viewBox="0 0 60 31"><path d="M14 0 L30 28"/><path d="M46 0 L30 28"/></svg>
  <i class="ev-clip"></i>
  <div class="ev-badge">
    <i class="ev-slot"></i>
    <div class="ev-bd">
      <span class="ev-ev">{{EVENT_1|Event}} {{EVENT_2|name}}</span>
      <span class="ev-nm">{{NAME_1|Your}}<br>{{NAME_2|Name}}</span>
      <span class="ev-co">{{COMPANY|Your company}}</span>
      <i class="ev-qr"></i>
    </div>
    <div class="ev-role">{{ROLE_LABEL|SPEAKER}}</div>
  </div>
</div>
<div class="ev-txt">
  <h3 class="ev-h"><span>{{EVENT_1|Event}}</span><span>{{EVENT_2|name}}</span></h3>
  <p class="ev-org">{{ORG_LINE|Organizer · City}}</p>
</div>
<div class="ev-foot"><span class="ev-live"><i></i>{{FOOT_LABEL|Speaker}}</span><span class="ev-eq" aria-hidden="true"><b></b><b></b><b></b><b></b></span></div>
</div>
