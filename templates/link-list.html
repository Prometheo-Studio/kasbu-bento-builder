<!-- Block: link-list · dark list of links · desktop 3×2 (~307×193) · phone 4×2 (~350×167)
     Up to 3 rows. A soft highlight travels down the rows; the arrow chip turns on hover. Switches to the phone layout at ≥ 315px.
     data: TAG ("links"), LINKS ([{label, hint, url}] up to 3), ACCENT -->
<div class="ll" role="group" aria-label="{{TAG|links}}" style="{{RAW_ACCENT_VARS}}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');
{{> page-bg ll}}
.ll{container-type:inline-size;display:block;width:100%;border-radius:inherit;background:#0b0b0d;color:#f4f1ec;font-family:'Inter',system-ui,sans-serif}
.ll *{box-sizing:border-box;margin:0}
.ll-in{position:relative;width:100%;aspect-ratio:307/193;overflow:hidden;isolation:isolate;border-radius:inherit;background:radial-gradient(70% 90% at 100% 100%,rgba(var(--a-rgb),.18),transparent 65%),#0b0b0d;display:flex;flex-direction:column;justify-content:center;padding:0 6cqw}
{{> noise ll-in}}
.ll-k{margin-bottom:3.4cqw;font:500 3.3cqw/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,241,236,.58)}
.ll-r{position:relative;display:flex;align-items:center;justify-content:space-between;gap:3cqw;padding:3.6cqw 0;border-top:1px solid rgba(255,255,255,.12);color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.ll-r::before{content:"";position:absolute;inset:0 -2cqw;border-radius:2cqw;background:rgba(var(--a-rgb),.16);opacity:0;animation:ll-hl 9s infinite;animation-delay:calc(var(--i) * 3s)}
.ll-b{position:relative;min-width:0}
.ll-l{font:600 5.4cqw/1.1 'Inter',system-ui,sans-serif;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll-h{margin-top:1cqw;font:500 3cqw/1.1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:rgba(244,241,236,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll-c{position:relative;flex:none;width:8cqw;height:8cqw;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);font:500 4cqw/1 'Inter',system-ui,sans-serif;transition:transform .25s,background .25s,color .25s}
.ll-r:hover .ll-c{transform:rotate(45deg);background:#f4f1ec;color:#0b0b0d}
@keyframes ll-hl{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
@container (min-width:315px){
.ll-in{aspect-ratio:21/10;padding:0 5cqw}
.ll-k{margin-bottom:2cqw;font-size:2.9cqw}
.ll-r{padding:2.4cqw 0}
.ll-l{font-size:4.4cqw}.ll-h{font-size:2.6cqw;margin-top:.6cqw}
.ll-c{width:6.6cqw;height:6.6cqw;font-size:3.4cqw}
}
@media (prefers-reduced-motion:reduce){.ll *,.ll-in::after{animation:none!important}}
</style>
<div class="ll-in">
<div class="ll-k">[ {{TAG|links}} ]</div>
{{#each LINK_LIST}}<a class="ll-r" style="--i:{{.i}}" href="{{.url}}" target="_blank" rel="noopener"><span class="ll-b"><div class="ll-l">{{.label}}</div>{{#if .hint}}<div class="ll-h">{{.hint}}</div>{{/if}}</span><span class="ll-c" aria-hidden="true">↗</span></a>{{/each}}
</div>
</div>
