<!-- Block: logo-marquee · dark square 3×3 (~307×308) · three rows of client/brand logos scrolling in alternating directions.
     Logos are tinted white; on hover the chip turns light and shows the original colors. Pause on hover.
     data: LOGOS (array of image urls or {src,name}; transparent PNG/SVG work best), LABEL, HEADLINE, HEADLINE_EM (highlighted word), SUBLINE, ACCENT -->
<div class="wk" role="group" aria-label="{{LABEL|work}}: {{COUNT|0}} brands" style="{{RAW_ACCENT_VARS}}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
{{> page-bg wk}}
.wk{container-type:inline-size;position:relative;display:block;width:100%;height:100%;aspect-ratio:1/1;overflow:hidden;isolation:isolate;border-radius:inherit;background:#0b0b0d;color:#f4f1ec;font-family:'Inter',system-ui,sans-serif}
{{> noise wk}}
.wk *{box-sizing:border-box;margin:0}
.wk-glow{position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 45% at 88% 102%,rgba(var(--a-rgb),.3),transparent 70%),radial-gradient(55% 40% at 0% 0%,rgba(255,255,255,.07),transparent 70%);animation:wk-gl 6s ease-in-out infinite}
.wk-top{position:absolute;left:6.5cqw;right:6.5cqw;top:6cqw;display:flex;justify-content:space-between;font:500 3.2cqw/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.04em;color:rgba(244,241,236,.6);z-index:2}
.wk-rows{position:absolute;left:0;right:0;top:15.5cqw;display:flex;flex-direction:column;gap:3cqw;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.wk-row{display:flex;width:max-content;animation:wk-l 36s linear infinite}
.wk-row:nth-child(2){animation-name:wk-r;animation-duration:42s}
.wk-row:nth-child(3){animation-duration:30s}
.wk:hover .wk-row{animation-play-state:paused}
.wk-set{display:flex;gap:3cqw;padding-right:3cqw}
.wk-c{flex:none;height:15.5cqw;min-width:30cqw;padding:0 5cqw;border-radius:3cqw;display:grid;place-items:center;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);transition:background .35s,border-color .35s,transform .35s cubic-bezier(.2,.8,.2,1)}
.wk-c img{display:block;height:8.4cqw;width:auto;max-width:28cqw;object-fit:contain;filter:brightness(0) invert(1);opacity:.78;transition:opacity .35s,filter .35s}
.wk-c:hover{background:#f4f1ec;border-color:#f4f1ec;transform:translateY(-.8cqw)}
.wk-c:hover img{filter:none;opacity:1}
.wk-txt{position:absolute;left:6.5cqw;right:6.5cqw;bottom:6.5cqw}
.wk-h{font:700 6.8cqw/1.06 'Inter',system-ui,sans-serif;letter-spacing:-.03em}
.wk-h em{font-style:normal;background:linear-gradient(90deg,#f4f1ec,var(--a-lt));-webkit-background-clip:text;background-clip:text;color:transparent}
.wk-p{margin-top:2.2cqw;font:400 3.5cqw/1.4 'Inter',system-ui,sans-serif;color:rgba(244,241,236,.6)}
@keyframes wk-l{to{transform:translateX(-50%)}}
@keyframes wk-r{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes wk-gl{0%,100%{opacity:.65}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.wk *,.wk::after{animation:none!important}}
</style>
<i class="wk-glow" aria-hidden="true"></i>
<div class="wk-top"><span>[ {{LABEL|work}} ]</span><span>{{COUNT|0}} brands</span></div>
<div class="wk-rows">
  <div class="wk-row"><div class="wk-set">{{#each ROW1}}<span class="wk-c"><img alt="{{.name}}" src="{{.src}}"></span>{{/each}}</div><div class="wk-set">{{#each ROW1}}<span class="wk-c"><img alt="" src="{{.src}}"></span>{{/each}}</div></div>
  <div class="wk-row"><div class="wk-set">{{#each ROW2}}<span class="wk-c"><img alt="{{.name}}" src="{{.src}}"></span>{{/each}}</div><div class="wk-set">{{#each ROW2}}<span class="wk-c"><img alt="" src="{{.src}}"></span>{{/each}}</div></div>
  <div class="wk-row"><div class="wk-set">{{#each ROW3}}<span class="wk-c"><img alt="{{.name}}" src="{{.src}}"></span>{{/each}}</div><div class="wk-set">{{#each ROW3}}<span class="wk-c"><img alt="" src="{{.src}}"></span>{{/each}}</div></div>
</div>
<div class="wk-txt">
  <h3 class="wk-h">{{HEADLINE|Brands that already lit their}} <em>{{HEADLINE_EM|spark}}</em>.</h3>
  <p class="wk-p">{{SUBLINE|Branding, web, marketing and AI.}}</p>
</div>
</div>
