<!-- Block: profile-card · light business-card style · desktop 3×2 (~307×193) · mobile 4×2 (~350×167)
     Switches to the mobile layout by slot width (>= 315px), so it also shows in the editor's phone preview.
     data: NAME, INITIALS, ROLES (up to 4), LOCATION, CTA_LABEL, CTA_URL, SEAL_TEXT, ACCENT -->
<a class="pc" href="{{CTA_URL|https://example.com}}" target="_blank" rel="noopener" style="{{RAW_ACCENT_VARS}}" aria-label="{{NAME|Your Name}}, {{LOCATION|Your City}}. {{CTA_LABEL|Contact me}}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
{{> page-bg pc}}
.pc{container-type:inline-size;display:block;width:100%;border-radius:inherit;background:#f4f1ec;color:#0b0b0d;font-family:'Inter',system-ui,sans-serif;text-decoration:none;-webkit-tap-highlight-color:transparent}
.pc-in{position:relative;width:100%;aspect-ratio:307/193;overflow:hidden;isolation:isolate;border-radius:inherit;background:#f4f1ec}
{{> noise-ink pc-in}}
.pc *{box-sizing:border-box;margin:0}
.pc-glow{position:absolute;right:-12cqw;top:-22cqw;width:70cqw;height:60cqw;z-index:-1;background:radial-gradient(closest-side,rgba(var(--a-rgb),.28),transparent);animation:pc-gl 5s ease-in-out infinite}
.pc-cm{position:absolute;width:3cqw;height:3cqw;border:0 solid rgba(11,11,13,.35);z-index:1}
.pc-c1{left:2.4cqw;top:2.4cqw;border-top-width:.3cqw;border-left-width:.3cqw}
.pc-c2{right:2.4cqw;top:2.4cqw;border-top-width:.3cqw;border-right-width:.3cqw}
.pc-c3{left:2.4cqw;bottom:2.4cqw;border-bottom-width:.3cqw;border-left-width:.3cqw}
.pc-c4{right:2.4cqw;bottom:2.4cqw;border-bottom-width:.3cqw;border-right-width:.3cqw}
.pc-seal{position:absolute;left:6.5cqw;top:6.5cqw;width:30cqw;height:30cqw}
.pc-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:pc-spin 16s linear infinite}
.pc-ring text{font:500 8.2px 'JetBrains Mono',ui-monospace,monospace;fill:#0b0b0d}
.pc-mono{position:absolute;left:50%;top:50%;width:17cqw;height:17cqw;margin:-8.5cqw;border-radius:50%;display:grid;place-items:center;background:#0b0b0d;color:#f4f1ec;font:700 6.4cqw/1 'Inter',system-ui,sans-serif;letter-spacing:-.04em}
.pc-mono i{position:absolute;right:.4cqw;top:1.2cqw;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--a);animation:pc-pl 1.8s ease-out infinite}
.pc-t{position:absolute;left:42cqw;right:6.5cqw;top:7.4cqw}
.pc-n{font:700 9.6cqw/1 'Inter',system-ui,sans-serif;letter-spacing:-.045em;animation:pc-up .9s cubic-bezier(.2,.8,.2,1) both}
.pc-r{position:relative;margin-top:3cqw;height:4.6cqw;font:500 3.7cqw/1.25 'JetBrains Mono',ui-monospace,monospace;color:var(--a-dk);animation:pc-up .9s cubic-bezier(.2,.8,.2,1) both .12s}
.pc-r span{position:absolute;left:0;top:0;white-space:nowrap;overflow:hidden;width:0;border-right:.5cqw solid var(--a-dk);opacity:0;animation:pc-ty 12s infinite;animation-delay:calc(var(--d) * 1s)}
.pc-l{display:inline-flex;align-items:center;gap:1.4cqw;margin-top:3cqw;font:500 3.1cqw/1 'Inter',system-ui,sans-serif;color:#5a5650;animation:pc-up .9s cubic-bezier(.2,.8,.2,1) both .22s}
.pc-l svg{width:3.4cqw;height:3.4cqw;fill:none;stroke:var(--a);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pc-b{position:absolute;left:6.5cqw;right:6.5cqw;bottom:6.5cqw;height:14.4cqw;border-radius:3.6cqw;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 3.6cqw 0 4.4cqw;background:#0b0b0d;color:#f4f1ec;font:600 4.5cqw/1 'Inter',system-ui,sans-serif;animation:pc-bp 2.6s ease-out infinite;transition:background .3s}
.pc-b::before{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-160%) skewX(-18deg);animation:pc-sw 3.8s ease-in-out infinite}
.pc-b span{display:inline-flex;align-items:center;gap:2.2cqw}
.pc-b svg{width:5cqw;height:5cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pc-ar{display:grid;place-items:center;width:8.4cqw;height:8.4cqw;border-radius:50%;background:var(--a);color:#fff;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pc-ar svg{width:4.2cqw;height:4.2cqw}
.pc:hover .pc-b{background:var(--a-dk)}
.pc:hover .pc-ar{transform:translate(.6cqw,-.6cqw) rotate(45deg);background:#0b0b0d}
@keyframes pc-ty{0%{width:0;opacity:1;animation-timing-function:steps(var(--n))}8%,20%{width:calc(var(--n) * 1ch);opacity:1}22%,100%{width:calc(var(--n) * 1ch);opacity:0}}
@keyframes pc-bp{0%{box-shadow:0 0 0 0 rgba(var(--a-rgb),.5)}100%{box-shadow:0 0 0 3.4cqw rgba(var(--a-rgb),0)}}
@keyframes pc-pl{0%{box-shadow:0 0 0 0 rgba(var(--a-rgb),.7)}100%{box-shadow:0 0 0 2.4cqw rgba(var(--a-rgb),0)}}
@keyframes pc-sw{0%,40%{transform:translateX(-160%) skewX(-18deg)}80%,100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes pc-spin{to{transform:rotate(360deg)}}
@keyframes pc-up{from{opacity:0;transform:translateY(3cqw)}to{opacity:1;transform:none}}
@keyframes pc-gl{0%,100%{opacity:.6}50%{opacity:1}}
/* mobile: slot of 315px or more (desktop 3-column slot is 307px) */
@container (min-width: 315px){
  .pc-in{aspect-ratio:21/10}
  .pc-glow{right:-14cqw;top:-26cqw;width:80cqw;height:70cqw}
  .pc-seal{left:5cqw;top:5cqw;width:24cqw;height:24cqw}
  .pc-mono{width:13.6cqw;height:13.6cqw;margin:-6.8cqw;font-size:5.2cqw}
  .pc-mono i{right:.3cqw;top:.9cqw;width:2.2cqw;height:2.2cqw}
  .pc-t{left:33.5cqw;right:5cqw;top:5.2cqw}
  .pc-r{margin-top:2.4cqw;height:5cqw;font-size:3.9cqw}
  .pc-l{margin-top:2.6cqw;font-size:3.5cqw}
  .pc-l svg{width:3.9cqw;height:3.9cqw}
  .pc-b{left:5cqw;right:5cqw;bottom:5cqw;height:12.4cqw;border-radius:3.2cqw;padding:0 3cqw 0 4cqw;font-size:4.7cqw}
  .pc-b svg{width:5.4cqw;height:5.4cqw}
  .pc-ar{width:7.4cqw;height:7.4cqw}
  .pc-ar svg{width:3.8cqw;height:3.8cqw}
}
@media (prefers-reduced-motion:reduce){.pc *,.pc-in::after{animation:none!important}.pc-r span:first-child{width:calc(var(--n) * 1ch);opacity:1;border-right:0}}
</style>
<div class="pc-in">
  <i class="pc-glow" aria-hidden="true"></i>
  <i class="pc-cm pc-c1" aria-hidden="true"></i><i class="pc-cm pc-c2" aria-hidden="true"></i><i class="pc-cm pc-c3" aria-hidden="true"></i><i class="pc-cm pc-c4" aria-hidden="true"></i>
  <div class="pc-seal" aria-hidden="true">
    <svg class="pc-ring" viewBox="0 0 100 100"><defs><path id="pc-circ" d="M50,50 m-42,0 a42,42 0 1,1 84,0 a42,42 0 1,1 -84,0"/></defs><text><textPath href="#pc-circ" textLength="262" lengthAdjust="spacing">{{SEAL_TEXT|YOUR ROLE · YOUR CRAFT · YOUR CITY · }}</textPath></text></svg>
    <span class="pc-mono">{{INITIALS|YN}}<i></i></span>
  </div>
  <div class="pc-t">
    <h3 class="pc-n">{{NAME|Your Name}}</h3>
    <div class="pc-r" aria-label="{{#each ROLE_LIST}}{{.text}}{{#if .last}}{{else}}, {{/if}}{{/each}}">{{#each ROLE_LIST}}<span style="--n:{{.length}};--d:{{.delay}}">{{.text}}</span>{{/each}}</div>
    <span class="pc-l"><svg viewBox="0 0 24 24"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>{{LOCATION|Your City}}</span>
  </div>
  <div class="pc-b">
    <span><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>{{CTA_LABEL|Contact me}}</span>
    <i class="pc-ar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
  </div>
</div>
</a>
