<!-- Block: project-card · tall dark card 2×3 (~193×308) · screenshot that pans slowly, shine sweep, name and tags.
     Use one block per project (same template = same css, safe to repeat on one page).
     data: NAME, INDEX ("01"), TAGS (up to 3 strings), IMAGE (url), IMAGE_POS ("50% 12%"), ACCENT (per-project color), URL (optional link) -->
<{{#if URL}}a href="{{URL}}" target="_blank" rel="noopener"{{else}}div{{/if}} class="pj" style="{{RAW_ACCENT_VARS}}" aria-label="{{NAME|Project name}}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
{{> page-bg pj}}
.pj{container-type:inline-size;position:relative;display:block;width:100%;height:100%;aspect-ratio:5/8;overflow:hidden;isolation:isolate;border-radius:inherit;background:#0b0b0d;color:#f4f1ec;font-family:'Inter',system-ui,sans-serif;text-decoration:none}
{{> noise pj}}
.pj *{box-sizing:border-box;margin:0}
.pj-glow{position:absolute;left:50%;top:-10cqw;width:130cqw;height:90cqw;margin-left:-65cqw;z-index:-1;background:radial-gradient(closest-side,var(--a),transparent);opacity:.3;animation:pj-gl 5s ease-in-out infinite}
.pj-fr{position:absolute;left:6cqw;right:6cqw;top:6cqw;height:103cqw;border-radius:4cqw;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:#111;box-shadow:0 3cqw 8cqw rgba(0,0,0,.45)}
.pj-fr img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.22);animation:pj-pan 11s ease-in-out infinite alternate}
.pj-fr::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:translateX(-160%) skewX(-18deg);animation:pj-sh 6s ease-in-out infinite}
.pj-n{position:absolute;left:3cqw;top:3cqw;z-index:2;padding:1.6cqw 2.6cqw;border-radius:99px;font:500 3cqw/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.05em;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pj-n i{display:inline-block;width:1.8cqw;height:1.8cqw;margin-right:1.4cqw;border-radius:50%;background:var(--a);vertical-align:.1cqw}
.pj-in{position:absolute;left:6.5cqw;right:6.5cqw;bottom:6.5cqw}
.pj-h{font:700 9.6cqw/1 'Inter',system-ui,sans-serif;letter-spacing:-.04em;white-space:nowrap;animation:pj-up .9s cubic-bezier(.2,.8,.2,1) both .1s}
.pj-ch{display:flex;flex-wrap:wrap;gap:1.8cqw;margin-top:3.4cqw;animation:pj-up .9s cubic-bezier(.2,.8,.2,1) both .25s}
.pj-c{padding:1.9cqw 3cqw;border-radius:99px;font:500 3.3cqw/1 'Inter',system-ui,sans-serif;color:rgba(244,241,236,.8);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.pj-ar{position:absolute;right:0;top:0;width:9cqw;height:9cqw;border-radius:50%;display:grid;place-items:center;background:var(--a);color:#0b0b0d;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pj-ar svg{width:4.4cqw;height:4.4cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pj:hover .pj-ar{transform:rotate(45deg) scale(1.1)}
@keyframes pj-pan{from{transform:scale(1.22) translateX(-4%)}to{transform:scale(1.22) translateX(4%)}}
@keyframes pj-sh{0%,40%{transform:translateX(-160%) skewX(-18deg)}80%,100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes pj-gl{0%,100%{opacity:.22}50%{opacity:.42}}
@keyframes pj-up{from{opacity:0;transform:translateY(3cqw)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pj *,.pj::after{animation:none!important}}
</style>
<i class="pj-glow" aria-hidden="true"></i>
<div class="pj-fr">
  <img alt="{{NAME|Project name}}" src="{{IMAGE|data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7}}" style="object-position:{{IMAGE_POS|50% 20%}}">
  <span class="pj-n"><i></i>{{INDEX|01}} · {{LABEL|project}}</span>
</div>
<div class="pj-in">
  <h3 class="pj-h">{{NAME|Project name}}</h3>
  <div class="pj-ch">{{#each TAGS}}<span class="pj-c">{{.}}</span>{{/each}}</div>
  <span class="pj-ar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
</div>
</{{#if URL}}a{{else}}div{{/if}}>
