<!-- Block: quote-card · dark quote tile · desktop 3×2 (~307×193) · phone 4×2 (~350×167)
     One short quote (≤ 90 characters reads best), author, role. Switches to the phone layout by slot width (≥ 315px).
     data: QUOTE, NAME, ROLE, COMPANY (optional), INITIALS (auto from NAME), TAG ("quote"), ACCENT -->
<div class="qt" role="group" aria-label="{{TAG|quote}}: {{NAME|Name}}" style="{{RAW_ACCENT_VARS}}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=swap');
{{> page-bg qt}}
.qt{container-type:inline-size;display:block;width:100%;border-radius:inherit;background:#0b0b0d;color:#f4f1ec;font-family:'Inter',system-ui,sans-serif}
.qt *{box-sizing:border-box;margin:0}
.qt-in{position:relative;width:100%;aspect-ratio:307/193;overflow:hidden;isolation:isolate;border-radius:inherit;background:radial-gradient(90% 120% at 100% 0%,rgba(var(--a-rgb),.22),transparent 60%),#0b0b0d}
{{> noise qt-in}}
.qt-g{position:absolute;left:6cqw;top:3cqw;font:italic 400 24cqw/1 'Instrument Serif',Georgia,serif;color:var(--a);animation:qt-pu 3.4s ease-in-out infinite;transform-origin:20% 60%}
.qt-q{position:absolute;left:6cqw;right:7cqw;top:23cqw;font:500 6.2cqw/1.3 'Inter',system-ui,sans-serif;letter-spacing:-.015em;animation:qt-up .9s cubic-bezier(.2,.8,.2,1) .15s both}
.qt-a{position:absolute;left:6cqw;right:6cqw;bottom:6cqw;display:flex;align-items:center;gap:3.2cqw;padding-top:3.4cqw;border-top:1px solid rgba(255,255,255,.12)}
.qt-a::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:100%;background:var(--a);transform-origin:0 50%;animation:qt-ln 6s ease-in-out infinite}
.qt-av{position:relative;flex:none;width:9cqw;height:9cqw;border-radius:50%;display:grid;place-items:center;font:600 3.4cqw/1 'Inter',system-ui,sans-serif;background:rgba(var(--a-rgb),.2);color:#fff;border:1px solid rgba(var(--a-rgb),.7)}
.qt-n{font:600 4.2cqw/1.1 'Inter',system-ui,sans-serif}
.qt-r{margin-top:1.2cqw;font:500 3cqw/1.2 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:rgba(244,241,236,.58)}
@keyframes qt-up{0%{opacity:0;transform:translateY(3cqw)}100%{opacity:1;transform:translateY(0)}}
@keyframes qt-pu{0%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.7}100%{transform:scale(1);opacity:1}}
@keyframes qt-ln{0%{transform:scaleX(0)}55%{transform:scaleX(1)}85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@container (min-width:315px){
.qt-in{aspect-ratio:21/10}
.qt-g{font-size:17cqw;left:5cqw;top:2cqw}
.qt-q{font-size:5cqw;top:15cqw;left:5cqw;right:6cqw}
.qt-a{left:5cqw;right:5cqw;bottom:4.5cqw;padding-top:2.6cqw}
.qt-av{width:8cqw;height:8cqw;font-size:3cqw}
.qt-n{font-size:3.7cqw}.qt-r{font-size:2.7cqw}
}
@media (prefers-reduced-motion:reduce){.qt *,.qt-in::after{animation:none!important}.qt-a::before{transform:none}}
</style>
<div class="qt-in">
<div class="qt-g" aria-hidden="true">“</div>
<p class="qt-q">{{QUOTE|Working with them felt like having a real partner in the process.}}</p>
<div class="qt-a">
<span class="qt-av" aria-hidden="true">{{INITIALS|AB}}</span>
<div><div class="qt-n">{{NAME|Name Surname}}</div><div class="qt-r">{{ROLE|Founder}}{{#if COMPANY}} · {{COMPANY}}{{/if}}</div></div>
</div>
</div>
</div>
