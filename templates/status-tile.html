<!-- Block: status-tile · dark status chip · 2×1 (~192×78 desktop, ~168×78 phone; the extra phone height shows the page black)
     A pulsing dot and a short status: "Open to projects", "Booking July", "Building in public".
     data: STATUS (≤ 18 characters), SUB (≤ 24 characters), URL (optional link), ACCENT -->
<{{#if URL}}a href="{{URL}}" target="_blank" rel="noopener"{{else}}div{{/if}} class="ss" role="group" aria-label="{{STATUS|Open to projects}}" style="{{RAW_ACCENT_VARS}}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&display=swap');
{{> page-bg ss}}
.ss{container-type:inline-size;position:relative;display:block;width:100%;aspect-ratio:192/78;overflow:hidden;isolation:isolate;border-radius:inherit;background:linear-gradient(100deg,rgba(var(--a-rgb),.24),transparent 70%),#0b0b0d;color:#f4f1ec;font-family:'Inter',system-ui,sans-serif;text-decoration:none;-webkit-tap-highlight-color:transparent}
{{> noise ss}}
.ss *{box-sizing:border-box;margin:0}
.ss-d{position:absolute;left:9cqw;top:50%;width:6cqw;height:6cqw;margin-top:-3cqw;border-radius:50%;background:var(--a);animation:ss-p 2s infinite}
.ss-t{position:absolute;left:21cqw;right:6cqw;top:50%;transform:translateY(-50%)}
.ss-s{font:600 7.4cqw/1.15 'Inter',system-ui,sans-serif;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-u{margin-top:2cqw;font:500 4.6cqw/1.1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:rgba(244,241,236,.58);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes ss-p{0%{box-shadow:0 0 0 0 rgba(var(--a-rgb),.7),0 0 0 0 rgba(var(--a-rgb),.4)}100%{box-shadow:0 0 0 5cqw rgba(var(--a-rgb),0),0 0 0 10cqw rgba(var(--a-rgb),0)}}
@media (prefers-reduced-motion:reduce){.ss *,.ss::after{animation:none!important}}
</style>
<span class="ss-d" aria-hidden="true"></span>
<div class="ss-t"><div class="ss-s">{{STATUS|Open to projects}}</div>{{#if SUB}}<div class="ss-u">{{SUB}}</div>{{/if}}</div>
</{{#if URL}}a{{else}}div{{/if}}>
