<!-- Block: timeline-card · dark square 3×3 (~307×308) → phone 4×4 (~348×348) · a vertical timeline whose dots light up in turn.
     Use it for your path, milestones, a roadmap. 2 to 4 items.
     data: TAG ("path"), TITLE, ITEMS ([{year, text}]), ACCENT -->
<div class="tl" role="group" aria-label="{{TAG|path}}: {{TITLE|My path}}" style="{{RAW_ACCENT_VARS}}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');
{{> page-bg tl}}
.tl{container-type:inline-size;position:relative;display:block;width:100%;height:100%;aspect-ratio:1/1;overflow:hidden;isolation:isolate;border-radius:inherit;background:radial-gradient(80% 60% at 0% 0%,rgba(var(--a-rgb),.2),transparent 65%),#0b0b0d;color:#f4f1ec;font-family:'Inter',system-ui,sans-serif}
{{> noise tl}}
.tl *{box-sizing:border-box;margin:0}
.tl-k{position:absolute;left:8cqw;top:8cqw;font:500 3.6cqw/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,241,236,.58)}
.tl-t{position:absolute;left:8cqw;right:8cqw;top:15cqw;font:600 8.6cqw/1.05 'Inter',system-ui,sans-serif;letter-spacing:-.035em}
.tl-l{position:absolute;left:8cqw;right:8cqw;top:34cqw;bottom:8cqw;list-style:none;padding:0;display:flex;flex-direction:column;justify-content:space-between}
.tl-l::before{content:"";position:absolute;left:1.5cqw;top:2cqw;bottom:2cqw;width:1px;background:rgba(255,255,255,.16)}
.tl-l li{position:relative;padding-left:9cqw;animation:tl-in .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * .12s)}
.tl-l li::before{content:"";position:absolute;left:0;top:.6cqw;width:3.2cqw;height:3.2cqw;border-radius:50%;background:#0b0b0d;border:1px solid rgba(255,255,255,.4);animation:tl-d {{CYCLE}}s infinite;animation-delay:calc(var(--i) * 2s)}
.tl-y{font:500 3.3cqw/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;color:var(--a-lt)}
.tl-x{margin-top:1.4cqw;font:500 5cqw/1.25 'Inter',system-ui,sans-serif;letter-spacing:-.01em;color:#f4f1ec}
{{RAW_KF}}
@keyframes tl-in{0%{opacity:0;transform:translateY(2.4cqw)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.tl *,.tl::after{animation:none!important}.tl-l li:first-child::before{background:var(--a);border-color:var(--a)}}
</style>
<div class="tl-k">[ {{TAG|path}} ]</div>
<h3 class="tl-t">{{TITLE|My path}}</h3>
<ul class="tl-l">{{#each ITEM_LIST}}<li style="--i:{{.i}}"><div class="tl-y">{{.year}}</div><div class="tl-x">{{.text}}</div></li>{{/each}}</ul>
</div>
